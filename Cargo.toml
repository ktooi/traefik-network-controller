[package]
name = "traefik-network-controller"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Policy-controlled Docker network lifecycle management for Traefik"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "signal", "time", "sync", "net", "io-util", "io-std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

